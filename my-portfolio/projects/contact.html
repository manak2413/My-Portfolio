<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #050816;
            color: white;
            overflow-x: hidden;
        }

        /* NAVBAR */

        nav {
            width: 100%;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            font-size: 45px;
            color: #9b5cff;
        }

        nav ul {
            display: flex;
            gap: 50px;
            list-style: none;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 20px;
            transition: .3s;
        }

        nav ul li a:hover {
            color: #9b5cff;
        }

        
    /* .contact-btn{
      padding:15px 30px;
      border:1px solid #9b5cff;
      border-radius:15px;
      background:transparent;
      color:white;
      cursor:pointer;
      transition:.3s;
    }

    .contact-btn:hover{
      background:#9b5cff;
    } */

        /* CONTACT SECTION */

        .contact-section {
            width: 100%;
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 8%;
            position: relative;
        }

        .contact-container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 60px;
        }

        /* LEFT SIDE */

        .left {
            width: 40%;
            z-index: 2;
        }

        .small-title {
            color: #9b5cff;
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .left h2 {
            font-size: 90px;
            line-height: 90px;
            margin-bottom: 25px;
        }

        .left h2 span {
            color: #9b5cff;
        }

        .line {
            width: 70px;
            height: 3px;
            background: #9b5cff;
            margin-bottom: 30px;
        }

        .left p {
            color: #cfcfcf;
            line-height: 1.8;
            font-size: 22px;
            margin-bottom: 40px;
        }

        .info {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .icon {
            width: 70px;
            height: 70px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            color: #9b5cff;
            font-size: 28px;
            background: #0d1020;
        }

        .info h3 {
            color: #9b5cff;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .info span {
            font-size: 24px;
        }

        .social {
            display: flex;
            gap: 25px;
            margin-top: 40px;
        }

        .social a {
            width: 65px;
            height: 65px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 28px;
            transition: .3s;
            background: #0d1020;
        }

        .social a:hover {
            background: #9b5cff;
            transform: translateY(-5px);
        }

        /* RIGHT SIDE */

        .right {
            width: 55%;
            position: relative;
            z-index: 2;
        }

        .form-box {
            width: 100%;
            padding: 45px;
            border-radius: 35px;
            border: 2px solid #9b5cff;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(155, 92, 255, 0.5);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .input-box {
            width: 100%;
            height: 80px;
            background: #080b18;
            border: 1px solid #5c2bbd;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 20px;
        }

        .input-box i {
            color: #9b5cff;
            font-size: 24px;
        }

        .input-box input {
            width: 100%;
            height: 100%;
            background: none;
            border: none;
            outline: none;
            color: white;
            font-size: 22px;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: #080b18;
            border: 1px solid #5c2bbd;
            border-radius: 20px;
            padding: 25px;
            outline: none;
            color: white;
            font-size: 22px;
            resize: none;
        }

        .send-btn {
            width: 100%;
            height: 85px;
            border: none;
            border-radius: 20px;
            background: linear-gradient(to right, #7b2ff7, #c084fc);
            color: white;
            font-size: 28px;
            cursor: pointer;
            transition: .3s;
            font-weight: bold;
        }

        .send-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(155, 92, 255, 0.7);
        }

        /* GLOW */

       

        /* RESPONSIVE */

        @media(max-width:1100px) {

            .contact-container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left h2 {
                font-size: 65px;
                line-height: 70px;
            }

            nav ul {
                display: none;
            }
            
            .input-box{
                height: 50px;
            }

        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <h1>MK</h1>

        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./index.html">About</a></li>
            <li><a href="./index.html">Services</a></li>
            <li><a href="./index.html">Portfolio</a></li>
            <li><a href="./index.html">skills</a></li>
        </ul>

        <!-- <button class="contact-btn">Contact Me</button> -->

    </nav>


    <!-- CONTACT SECTION -->

    <section class="contact-section">

        <div class="glow"></div>

        <div class="contact-container">

            <!-- LEFT -->

            <div class="left">

                <h4 class="small-title">GET IN TOUCH</h4>

                <h2>Contact <span>Me</span></h2>

                <div class="line"></div>

                <p>
                    I’m always open to discussing new projects,
                    creative ideas or opportunities to be part
                    of your visions.
                </p>

                <div class="info">

                    <div class="icon">
                        <i class="fa-regular fa-envelope"></i>
                    </div>

                    <div>
                        <h3>Email</h3>
                        <span>manak2413@gmail.com</span>
                    </div>

                </div>


                <div class="info">

                    <div class="icon">
                        <i class="fa-solid fa-phone"></i>
                    </div>

                    <div>
                        <h3>Phone</h3>
                        <span>+91 9950893931</span>
                    </div>

                </div>


                <div class="info">

                    <div class="icon">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>

                    <div>
                        <h3>Location</h3>
                        <span>Rajasthan, India</span>
                    </div>

                </div>


                <!-- SOCIAL -->

                <div class="social">

                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>

                    <a href="#"><i class="fa-brands fa-github"></i></a>

                    <a href="#"><i class="fa-brands fa-instagram"></i></a>

                    <a href="#"><i class="fa-solid fa-basketball"></i></a>

                </div>

            </div>


            <!-- RIGHT -->

            <div class="right">

                <div class="form-box">

                    <form>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input type="text" placeholder="Your Name">

                        </div>


                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input type="email" placeholder="Your Email">

                        </div>


                        <div class="input-box">

                            <i class="fa-regular fa-file-lines"></i>

                            <input type="text" placeholder="Subject">

                        </div>


                        <textarea placeholder="Write Your Message..."></textarea>

                        <button class="send-btn">
                            <i class="fa-regular fa-paper-plane"></i>
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </section>

  

</body>

</html>
