<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Lock App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1d2671,#c33764);
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:380px;
    padding:35px;
    text-align:center;
    border-radius:20px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 35px rgba(0,0,0,.35);
    color:#fff;
}

.lock{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#ffffff22;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    animation:float 2s infinite ease-in-out;
}

@keyframes float{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0);
    }

}

h1{
    margin-top:20px;
    margin-bottom:10px;
    font-size:32px;
}

.status{
    margin-bottom:20px;
    color:#ddd;
    min-height:24px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    outline:none;
    border-radius:10px;
    margin-bottom:20px;
    text-align:center;
    font-size:16px;
    background:#ffffff;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    margin-top:12px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    color:#fff;
    font-weight:bold;
}

button i{
    margin-right:8px;
}

#setVoice{
    background:#27ae60;
}

#setVoice:hover{
    background:#1f8a4c;
}

#unlockVoice{
    background:#3498db;
}

#unlockVoice:hover{
    background:#217dbb;
}

#resetVoice{
    background:#e74c3c;
}

#resetVoice:hover{
    background:#c0392b;
}

.wave{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:8px;
    visibility:hidden;
}

.wave.active{
    visibility:visible;
}

.wave span{

    width:8px;
    height:35px;
    background:#fff;
    border-radius:10px;
    animation:wave .8s infinite;

}

.wave span:nth-child(2){
    animation-delay:.2s;
}

.wave span:nth-child(3){
    animation-delay:.4s;
}

@keyframes wave{

    0%{
        height:12px;
    }

    50%{
        height:45px;
    }

    100%{
        height:12px;
    }

}

.success{
    color:#00ff99;
    font-weight:bold;
}

.error{
    color:#ff4b4b;
    font-weight:bold;
}

@media(max-width:500px){

.card{

    width:95%;
    padding:25px;

}

h1{

    font-size:28px;

}

button{

    font-size:15px;

}

}</style>
</head>
<body>

<div class="container">

    <div class="card">

        <div class="lock">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Voice Lock</h1>

        <p class="status" id="status">
            Click button to set or unlock
        </p>

        <input
            type="text"
            id="voiceText"
            placeholder="Voice Password"
            readonly
        >

        <button id="setVoice">
            <i class="fa-solid fa-microphone"></i>
            Set Voice Password
        </button>

        <button id="unlockVoice">
            <i class="fa-solid fa-lock-open"></i>
            Unlock
        </button>

        <button id="resetVoice">
            <i class="fa-solid fa-rotate-left"></i>
            Reset Password
        </button>

        <div class="wave" id="wave">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

</div>
<script>
    // ==============================
// Voice Lock App
// ==============================

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  alert("Your browser does not support Speech Recognition.\nPlease use Google Chrome.");
}

const recognition = new SpeechRecognition();

recognition.lang = "en-US";      // चाहें तो "hi-IN" कर सकते हैं
recognition.continuous = false;
recognition.interimResults = false;

// Elements
const status = document.getElementById("status");
const input = document.getElementById("voiceText");
const wave = document.getElementById("wave");

const setBtn = document.getElementById("setVoice");
const unlockBtn = document.getElementById("unlockVoice");
const resetBtn = document.getElementById("resetVoice");

// Mode
let mode = "";

// Load Saved Password
const savedPassword = localStorage.getItem("voicePassword");

if (savedPassword) {
  input.value = "********";
  status.innerHTML = "Voice Password Already Saved";
}

// ======================
// Set Voice Password
// ======================

setBtn.addEventListener("click", () => {

  mode = "set";

  status.innerHTML = "🎤 Speak your Voice Password...";
  status.className = "status";

  wave.classList.add("active");

  recognition.start();

});

// ======================
// Unlock
// ======================

unlockBtn.addEventListener("click", () => {

  if (!localStorage.getItem("voicePassword")) {

    alert("Please set Voice Password first.");

    return;

  }

  mode = "unlock";

  status.innerHTML = "🎤 Speak to Unlock...";
  status.className = "status";

  wave.classList.add("active");

  recognition.start();

});

// ======================
// Recognition Result
// ======================

recognition.onresult = function(event){

  wave.classList.remove("active");

  let text = event.results[0][0].transcript.toLowerCase().trim();

  input.value = text;

  // --------------------
  // Save Password
  // --------------------

  if(mode === "set"){

    localStorage.setItem("voicePassword", text);

    status.innerHTML = "✅ Voice Password Saved";

    status.className = "status success";

    return;

  }

  // --------------------
  // Unlock
  // --------------------

  if(mode === "unlock"){

    const saved = localStorage.getItem("voicePassword");

    if(text === saved){

      status.innerHTML = "🔓 Unlock Successful";

      status.className = "status success";

      document.querySelector(".lock i").className =
      "fa-solid fa-lock-open";

      setTimeout(()=>{

        alert("Welcome!");

      },500);

    }

    else{

      status.innerHTML = "❌ Wrong Voice Password";

      status.className = "status error";

    }

  }

};

// ======================
// Error
// ======================

recognition.onerror = function(){

  wave.classList.remove("active");

  status.innerHTML = "Microphone Error";

  status.className = "status error";

};

// ======================
// Reset
// ======================

resetBtn.addEventListener("click",()=>{

  if(confirm("Delete Voice Password?")){

    localStorage.removeItem("voicePassword");

    input.value="";

    status.innerHTML="Voice Password Deleted";

    status.className="status";

    document.querySelector(".lock i").className =
    "fa-solid fa-lock";

  }

});
</script>

</body>
</html>
