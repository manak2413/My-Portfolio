<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Eyes Are Watching You</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-image:url("./background.png");
        }

        .container {
            display: flex;
            gap: 40px;
        }

        .eye {
            width: 90px;
            height: 90px;
            background: #111;
            border: 2px solid #ff0000;
            border-radius: 50%;
            position: relative;
            box-shadow:
                0 0 20px #ff0000,
                0 0 50px #ff0000,
                0 0 80px #ff0000;
            /* animation:glow 2s infinite alternate; */
        }

        .pupil {
            width: 25px;
            height: 25px;
            background: #ff0000;
            border-radius: 50%;
            position: absolute;
            top: 32px;
            left: 32px;
            transition: 0.05s;
            box-shadow:
                0 0 15px #ff0000,
                0 0 30px #ff0000;
        }

        @keyframes glow {
            from {
                box-shadow:
                    0 0 10px #ff0000,
                    0 0 30px #ff0000;
            }

            to {
                box-shadow:
                    0 0 25px #ff0000,
                    0 0 60px #ff0000,
                    0 0 100px #ff0000;
            }
        }

        .text {
            position: absolute;
            bottom: 80px;
            color: #ff0000;
            font-size: 2rem;
            letter-spacing: 6px;
            opacity: 0;
            text-shadow:
                0 0 10px #ff0000,
                0 0 30px #ff0000;
            transition: 2s;
        }

        .fog {
            position: absolute;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at center,
                    transparent 0%,
                    rgba(0, 0, 0, 0.6) 60%,
                    rgba(0, 0, 0, 1) 100%);
            pointer-events: none;
        }
    </style>
</head>

<body>

    
    <div class="fog"></div>

    <div class="container">
        <div class="eye">
            <div class="pupil"></div>
        </div>

        <div class="eye">
            <div class="pupil"></div>
        </div>
    </div>

    <div class="text" id="msg">
        YOU WERE NEVER ALONE
    </div>


    <script>

        const pupils = document.querySelectorAll(".pupil");

        document.addEventListener("mousemove", (e) => {

            pupils.forEach(pupil => {

                const eye = pupil.parentElement;

                const rect = eye.getBoundingClientRect();

                const eyeX = rect.left + rect.width / 2;
                const eyeY = rect.top + rect.height / 2;

                const angle = Math.atan2(
                    e.clientY - eyeY,
                    e.clientX - eyeX
                );

                const move = 20;

                const x = Math.cos(angle) * move;
                const y = Math.sin(angle) * move;

                pupil.style.transform =
                    `translate(${x}px, ${y}px)`;
            });

        });

        setTimeout(() => {
            document.getElementById("msg").style.opacity = "1";
        }, 1000);

    </script>

</body>

</html>
